name: leak-scan

# Scans what a push or PR adds to this public fork for internal identifiers.
# The identifier list lives only in the LEAK_PATTERNS repo secret; this file holds generic logic.
# Logs only say which commit / line / pattern number hit, never the matched text.

on:
  push:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: leak-scan-${{ github.ref }}
  # PR runs rescan the whole PR, so a newer run fully covers a cancelled one.
  # Push runs only scan before..after, so they must not be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    # Minimum of 5 minutes: no measured run yet; the scan itself takes seconds.
    timeout-minutes: 5
    env:
      LEAK_OWNER: ${{ github.repository_owner }}
      LEAK_NOREPLY: ${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream main (commits already there are not ours to scan)
        run: git fetch --no-tags --quiet https://github.com/mattpocock/skills main

      - name: Scan commits
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          up=$(git rev-parse --verify --quiet FETCH_HEAD) || { echo "cannot read upstream main"; exit 2; }
          if [ "$EVENT" = pull_request ]; then
            head="$PR_HEAD"; base="$PR_BASE"
          else
            head="$AFTER"; base="$BEFORE"
            # New branch (all-zero before) or a before we do not have: scan everything not in upstream.
            case "$base" in *[!0]*) git cat-file -e "${base}^{commit}" || base="" ;; *) base="" ;; esac
          fi
          bash .github/scripts/leak-scan.sh commits . "$up" "$head" ${base:+"$base"}

      - name: Scan PR title and body
        if: github.event_name == 'pull_request'
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -uo pipefail
          rc=0
          printf '%s\n' "$PR_TITLE" | bash .github/scripts/leak-scan.sh text pr-title || rc=$?
          [ "$rc" -le 1 ] || exit "$rc"
          r2=0
          printf '%s\n' "$PR_BODY" | bash .github/scripts/leak-scan.sh text pr-body || r2=$?
          [ "$r2" -le 1 ] || exit "$r2"
          exit $(( rc > r2 ? rc : r2 ))
